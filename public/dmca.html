<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden | Access Denied</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f9fafb;
            color: #374151;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            max-width: 600px;
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border-top: 4px solid #f97316; /* Cloudflare風のオレンジカラー */
        }
        h1 {
            font-size: 28px;
            color: #111827;
            margin-top: 0;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
        }
        .meta-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            font-size: 13px;
            color: #6b7280;
        }
        .meta-item {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Error 403: Access Denied</h1>
    <p>このウェブサイトへのアクセスは制限されています。</p>
    <p>当サイトに含まれるコンテンツに、<strong>著作権違反（DMCA侵害）</strong>の申し立てがあったため、管理者またはネットワーク保護サービスによってこのページの公開およびアクセスを一時的に停止しています。</p>
    
    <div class="meta-info">
        <div class="meta-item"><strong>Reason:</strong> Copyright Infringement (DMCA)</div>
        <div class="meta-item"><strong>Status:</strong> Blocked by Security Rule</div>
    </div>
</div>

</body>
</html>
